dates:
  checkin: "2026-12-11"
  checkout: "2026-12-12"

# Two acceptable layouts — the bot checks BOTH each run and ranks the
# cheapest combinations across all of them in one list.
configurations:
  - name: "1 room (4 adults + 1 infant)"
    rooms:
      - adults: 4
        children_ages: [0]
  - name: "2 rooms (2 adults + 1 infant / 2 adults)"
    rooms:
      - adults: 2
        children_ages: [0]
      - adults: 2
        children_ages: []

# CAD budget for the WHOLE stay (one or two rooms), taxes & fees included.
budget_cad: 375

# Minutes walk from Shibuya Scramble Crossing. Hotels farther than this
# are filtered out heuristically from Google Hotels distance text.
max_walk_minutes: 15

# How often to run a scheduled check.
check_interval_minutes: 60

# Daily 09:03 local-time summary (even if nothing hits the budget).
daily_summary: true

# Alert hysteresis: suppress repeat alerts for the same combo if its
# price moved less than this many CAD since the last alert.
alert_delta_cad: 5

paused: false
