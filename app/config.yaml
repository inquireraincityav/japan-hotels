dates:
  checkin: "2026-12-11"
  checkout: "2026-12-12"

# Two rooms. Infant is <1yr; most Japanese hotels count only adults for
# pricing but require declaration. We'll search 2 rooms x 2 adults each
# and separately note that room 1 also has 1 infant (hotel-specific policy
# dictates whether an infant adds a bed-fee).
rooms:
  - adults: 2
    children_ages: [0]   # infant, <1yr
  - adults: 2
    children_ages: []

# CAD budget for BOTH rooms combined, taxes & fees included.
budget_cad: 375

# Minutes walk from Shibuya Scramble Crossing. Hotels further than this
# are excluded.
max_walk_minutes: 15

# How often to run a scheduled check.
check_interval_minutes: 60

# Where to send the daily 09:00 summary (Y/N). Local time is read from
# the TZ env var.
daily_summary: true

# Alert hysteresis: only re-notify about the same hotel if its price
# changed by more than this many CAD since the last alert.
alert_delta_cad: 5

paused: false
